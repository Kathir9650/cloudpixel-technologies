<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090e" />
    <meta name="description" content="CloudPixel Technologies — Enterprise websites, scalable cloud infrastructure and DevOps automation for ambitious businesses worldwide. Fast, secure, beautiful." />
    <meta property="og:title" content="CloudPixel Technologies | Enterprise Web, Cloud & DevOps Studio" />
    <meta property="og:description" content="Obsidian-tier web development, scalable AWS cloud architecture & CI/CD automation for high-growth businesses." />
    <title>CloudPixel Technologies | Build. Innovate. Deploy.</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />

    <!-- Google Fonts: Plus Jakarta Sans + Syne + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Base background to prevent white flash during initial mount */
      html, body {
        background-color: #07090e;
        color: #f1f5f9;
        margin: 0;
        padding: 0;
      }

      /* Hero Stats — inline to avoid FOUC */
      .hero-stats {
        display: flex;
        gap: 28px;
        margin-top: 40px;
        flex-wrap: wrap;
      }
      .hero-stat {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .hero-stat strong {
        font-family: 'Syne', sans-serif;
        font-size: 28px;
        font-weight: 800;
        background: linear-gradient(135deg, #2563eb, #06b6d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
      }
      .hero-stat span {
        font-size: 11px;
        color: #64748b;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
